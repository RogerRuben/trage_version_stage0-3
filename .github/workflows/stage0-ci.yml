name: stage0-ci

on:
  push:
  pull_request:

jobs:
  stage0-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install pytest -r stage0/requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q stage0/scripts stage0/canonical scripts
      - name: Whitespace audit
        run: git diff --check
